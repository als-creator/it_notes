name: Build PDFs and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig pandoc texlive-xetex texlive-lang-cyrillic fonts-dejavu
          fc-cache -f

      - name: Build PDFs
        run: bash scripts/build-pdfs.sh pdfs

      - name: Upload PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: pdfs/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Set release tag
        id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download PDFs artifact
        uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: pdfs/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TAG="release-${{ steps.meta.outputs.date }}"
          echo "gh: $(gh --version | head -1)"
          echo "token set: $([ -n "$GH_TOKEN" ] && echo yes || echo no)"
          gh auth status 2>&1 | sed 's/^/auth: /'
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          mapfile -t PDFS < <(find pdfs -type f -name '*.pdf' | sort)
          echo "Found ${#PDFS[@]} PDFs"
          if [ "${#PDFS[@]}" -eq 0 ]; then
            echo "::error::No PDFs found in pdfs/"
            find pdfs -maxdepth 3 | head -20
            exit 1
          fi
          OUT=$(gh release create "$TAG" "${PDFS[@]}" \
            --title "Release ${{ steps.meta.outputs.date }}" \
            --notes "PDF-версии мануалов" 2>&1); R=$?
          if [ $R -ne 0 ]; then
            printf '::error title=gh release create::%s\n' "$(echo "$OUT" | tail -n 20 | tr '\n' ' ' | tr '%' '%%')"
            exit $R
          fi
          echo "$OUT"
