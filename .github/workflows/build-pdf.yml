name: Build PDFs and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig pandoc texlive-xetex texlive-lang-cyrillic fonts-dejavu
          fc-cache -f

      - name: Build PDFs
        run: bash scripts/build-pdfs.sh pdfs

      - name: Upload PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: pdfs/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set release tag
        id: meta
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "shorthash=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download PDFs artifact
        uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: pdfs/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TAG="release-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.shorthash }}"
          echo "tag=$TAG"
          mapfile -t PDFS < <(find pdfs -type f -name '*.pdf' | sort)
          echo "found=${#PDFS[@]}"
          if [ "${#PDFS[@]}" -eq 0 ]; then
            echo "::error::No PDFs in pdfs/"
            find pdfs -maxdepth 3 | head
            exit 1
          fi
          gh release create "$TAG" \
            --title "Release ${{ steps.meta.outputs.date }}" \
            --notes "PDF-версии мануалов" >/dev/null 2>&1
          if [ $? -ne 0 ]; then
            gh release create "$TAG" \
              --title "Release ${{ steps.meta.outputs.date }}" \
              --notes "PDF-версии мануалов" 2>&1 | tail -8
            exit 1
          fi
          echo "release created, uploading assets"
          ok=0
          for attempt in 1 2 3 4 5; do
            gh release upload "$TAG" "${PDFS[@]}" --clobber >/dev/null 2>&1
            if [ $? -eq 0 ]; then ok=1; echo "upload_ok_attempt=$attempt"; break; fi
            echo "upload attempt $attempt failed, retrying in 8s"
            sleep 8
          done
          if [ $ok -ne 1 ]; then
            echo "::error::Release upload failed after 5 attempts"
            gh release upload "$TAG" "${PDFS[@]}" --clobber 2>&1 | tail -8
            exit 1
          fi
          echo "assets=$(gh release view "$TAG" --json assets -q '.assets | length')"
