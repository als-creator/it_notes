name: Build PDFs and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig pandoc texlive-xetex texlive-lang-cyrillic fonts-dejavu
          fc-cache -f

      - name: Build PDFs
        run: bash scripts/build-pdfs.sh pdfs

      - name: Upload PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: pdfs/

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Set release tag
        id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download PDFs artifact
        uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: pdfs/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release-${{ steps.meta.outputs.date }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" pdfs/* \
            --title "Release ${{ steps.meta.outputs.date }}" \
            --notes "PDF-версии мануалов"
