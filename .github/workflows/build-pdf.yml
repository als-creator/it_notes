name: Build PDFs and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig pandoc texlive-xetex texlive-lang-cyrillic fonts-dejavu
          fc-cache -f

      - name: Build PDFs
        run: bash scripts/build-pdfs.sh pdfs

      - name: Upload PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: pdfs/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set release tag
        id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download PDFs artifact
        uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: pdfs/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          esc() { sed -E 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'; }
          TAG="release-${{ steps.meta.outputs.date }}"
          echo "gh_ver=$(gh --version 2>&1 | head -1)"
          echo "token_len=${#GH_TOKEN}"
          gh auth status 2>&1 | sed 's/^/auth: /'
          echo "auth_code=$?"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1
          mapfile -t PDFS < <(find pdfs -type f -name '*.pdf' | sort)
          echo "found=${#PDFS[@]}"
          if [ "${#PDFS[@]}" -eq 0 ]; then
            echo "::error title=no pdfs in pdfs/::$(find pdfs -maxdepth 3 | tr '\n' ' ')"
            exit 1
          fi
          OUT="$(gh release create "$TAG" "${PDFS[@]}" \
            --title "Release ${{ steps.meta.outputs.date }}" \
            --notes "PDF-версии мануалов" 2>&1)"
          CODE=$?
          echo "release_code=$CODE"
          echo "--- gh output start ---"
          echo "$OUT"
          echo "--- gh output end ---"
          if [ $CODE -ne 0 ]; then
            echo "::error title=gh release create failed ($CODE)::$(echo "$OUT" | tail -n 12 | esc)"
            exit $CODE
          fi
          echo "release_ok=$(gh release view "$TAG" >/dev/null 2>&1 && echo yes || echo no)"
